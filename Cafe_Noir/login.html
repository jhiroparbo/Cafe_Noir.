<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="images/png" href="images/icon.png">
        <link rel="stylesheet" href="css/headerFooter.css">
        <link rel="stylesheet" href="css/login.css">
        <title>Login - Cafe Noir</title>
    </head>

    <body>
        <header>
            <div class="logo">
                <img src="images/logo.png" alt="Cafe Noir Logo">
                <div class="logo-text">
                    <h1>CAFE NOIR</h1>
                    <p>SIP THE DARK SIDE</p>
                </div>
            </div>

            <nav>
                <a href="home.html">HOME</a>
                <a href="aboutus.html">ABOUT US</a>
                <a href="login.html">LOGIN</a>
                <a href="cart.html" class="cart-link">
                    <img src="images/cart.png" class="cart" alt="Cart">
                    <span id="cartCount">0</span>
                </a>
            </nav>
        </header>

        <main>
            <section class="form-container">
                <h1>WELCOME BACK!</h1>
                <p>Sign in to continue</p>
                <form id="loginForm">
                    <input type="email" id="email" placeholder="Enter your email address" required autofocus pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" title="Enter a valid Email address">
                    
                    <input type="password" id="password" placeholder="Enter your password" minlength="8" maxlength="20" required title="Please enter your password">
            
                    <button type="submit">
                        SIGN IN
                    </button>
            
                    <p>Don't have an account?
                        <a href="register.html">Register here</a>
                    </p>
                </form>
            </section>
        </main>
        
        <footer>
            <h3>CAFE NOIR</h3>
            <p>© 2026 Cafe Noir. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://www.facebook.com/share/1QPphXe6Kz" target="_blank">
                    <img src="images/facebook.png" alt="Facebook">
                </a>
                <a href="https://www.instagram.com/noir_ndbean?obrf=Nm51czI0bm1wdG5o" target="_blank">
                    <img src="images/instagram.png" alt="Instagram">
                </a>
            </div>
        </footer>
        <script src="javaScipt/cartCounter.js"></script>
        <script src="javaScipt/login.js"></script>
    </body>
</html>
