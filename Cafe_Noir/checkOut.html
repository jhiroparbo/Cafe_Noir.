<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="images/icon.png">
        <link rel="stylesheet" href="css/headerFooter.css">
        <link rel="stylesheet" href="css/checkOut.css">
        <title>Checkout - Cafe Noir</title>
    </head>

    <body>
        <header>
            <div class="logo">
                <img src="images/logo.png" alt="Cafe Noir Logo">
                <div class="logo-text">
                    <h1>CAFE NOIR</h1>
                    <p>SIP THE DARK SIDE</p>
                </div>
            </div>
    
            <nav>
                <a href="home.html">HOME</a>
                <a href="aboutus.html">ABOUT US</a>
                <a href="login.html">LOGIN</a>
                <a href="cart.html" class="cart-link">
                    <img src="images/cart.png" class="cart" alt="Cart">
                    <span id="cartCount">0</span>
                </a>
            </nav>
        </header>
    
        <main class="checkout-page">
            <div class="progress-container">
                <div class="progress-step completed">
                    <span class="step-circle">✓</span>
                    <p>Cart</p>
                </div>
    
                <div class="progress-line completed"></div>
    
                <div class="progress-step active">
                    <span class="step-circle">2</span>
                    <p>Checkout</p>
                </div>
    
                <div class="progress-line"></div>
    
                <div class="progress-step">
                    <span class="step-circle">3</span>
                    <p>Pick-up Time</p>
                </div>
    
                <div class="progress-line"></div>
    
                <div class="progress-step">
                    <span class="step-circle">4</span>
                    <p>Payment</p>
                </div>
    
                <div class="progress-line"></div>
    
                <div class="progress-step">
                    <span class="step-circle">5</span>
                    <p>Confirmation</p>
                </div>
            </div>
            <h1>CHECKOUT</h1>

            <h2>Order Summary</h2>
    
            <div id="orderSummary"></div>
    
            <h2>Total: <span id="checkoutTotal">₱0.00</span></h2>
    
            <h2>Customer Information</h2>
    
            <form id="checkoutForm">
                <label for="customerName">Full Name</label>
                <input type="text" id="customerName" autofocus required>

                <label for="contactNumber">Contact Number</label>
                <input type="tel" id="contactNumber" pattern="[0-9]{11}" title="Enter an 11-digit contact number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" title="Enter a valid email address">
    
                <div class="checkout-buttons">
                    <a href="cart.html" class="back-button">
                        BACK
                    </a>
                    <button type="submit" class="continue-button">
                        CONTINUE
                    </button>
                </div>
            </form>
        </main>
    
        <footer>
            <h3>CAFE NOIR</h3>
            <p>© 2026 Cafe Noir. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://www.facebook.com/share/1QPphXe6Kz" target="_blank">
                    <img src="images/facebook.png" alt="Facebook">
                </a>
                <a href="https://www.instagram.com/noir_ndbean?obrf=Nm51czI0bm1wdG5o" target="_blank">
                    <img src="images/instagram.png" alt="Instagram">
                </a>
            </div>
        </footer>
        <script src="javaScipt/checkOut.js"></script>
        <script src="javaScipt/cartCounter.js"></script>
    </body>    
</html>
