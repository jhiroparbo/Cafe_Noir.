<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="images/icon.png">
        <link rel="stylesheet" href="css/headerFooter.css">
        <link rel="stylesheet" href="css/confirmation.css">
        <title>Confirmation - Cafe Noir</title>
    </head>
    
    <body>
        <header>
            <div class="logo">
                <img src="images/logo.png" alt="Cafe Noir Logo">
                <div class="logo-text">
                    <h1>CAFE NOIR</h1>
                    <p>SIP THE DARK SIDE</p>
                </div>
            </div>
    
            <nav>
                <a href="home.html">HOME</a>
                <a href="aboutus.html">ABOUT US</a>
                <a href="login.html">LOGIN</a>
                <a href="cart.html" class="cart-link">
                    <img src="images/cart.png" class="cart" alt="Cart">
                    <span id="cartCount">0</span>
                </a>
            </nav>
        </header>
    
        <main class="confirmation-page">
            <div class="progress-container">
    
                <div class="progress-step">
                    <div class="step-circle">✓</div>
                    <p>Cart</p>
                </div>
    
                <div class="progress-line"></div>
    
                <div class="progress-step">
                    <div class="step-circle">✓</div>
                    <p>Checkout</p>
                </div>
    
                <div class="progress-line"></div>
    
                <div class="progress-step">
                    <div class="step-circle">✓</div>
                    <p>Pick-up Time</p>
                </div>
    
                <div class="progress-line"></div>
    
                <div class="progress-step">
                    <div class="step-circle">✓</div>
                    <p>Payment</p>
                </div>
    
                <div class="progress-line"></div>
    
                <div class="progress-step active">
                    <div class="step-circle">✓</div>
                    <p>Confirmation</p>
                </div>
            </div>
    
            <h1>ORDER CONFIRMATION</h1>
    
            <h2>Thank you for ordering!</h2>
    
            <div id="orderDetails"></div>
    
            <button class="button" onclick="location.href='home.html'">
                BACK TO HOME
            </button>
        </main>
        
        <footer>
            <h3>CAFE NOIR</h3>
            <p>© 2026 Cafe Noir. All rights reserved.</p>
            <div class="social-icons">
                <a href="https://www.facebook.com/share/1QPphXe6Kz" target="_blank">
                    <img src="images/facebook.png" alt="Facebook">
                </a>
    
                <a href="https://www.instagram.com/noir_ndbean?obrf=Nm51czI0bm1wdG5o" target="_blank">
                    <img src="images/instagram.png" alt="Instagram">
                </a>
            </div>
        </footer>
        <script src="javaScipt/confirmation.js"></script>
        <script src="javaScipt/cartCounter.js"></script>
    </body>
</html>
